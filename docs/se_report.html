<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="auth.js?v=1793539534"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Engineer Performance Review — Shaker Group</title>
<style>
:root{
  --ink:#141b24;
  --ink-soft:#4a5563;
  --ink-faint:#8b96a3;
  --line:#e4e8ec;
  --line-soft:#eef1f4;
  --paper:#ffffff;
  --canvas:#f6f7f9;
  --blue:#1f5fd6;
  --blue-soft:#eaf1fc;
  --green:#137a4b;
  --green-soft:#e7f4ec;
  --amber:#b06f10;
  --amber-soft:#fbf1de;
  --red:#c0392f;
  --red-soft:#fbe9e7;
  --violet:#5b3fb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--canvas);
  color:var(--ink);
  line-height:1.45;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1440px;margin:0 auto;padding:28px 32px 60px}

/* Masthead */
.masthead{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.masthead h1{font-size:22px;font-weight:650;letter-spacing:-0.02em;line-height:1.1}
.masthead .company{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:5px}
.masthead .meta{text-align:right;font-size:11px;color:var(--ink-faint);line-height:1.7}
.masthead .meta b{color:var(--ink-soft);font-weight:600}

/* Method note */
.method{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0;font-size:11.5px;color:var(--ink-soft);line-height:1.6}
.method b{color:var(--ink);font-weight:600}

/* Controls */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 14px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.controls select{font-family:inherit;font-size:12px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font-family:inherit;font-size:11.5px;height:30px;padding:0 12px;border:none;border-right:1px solid var(--line);background:var(--paper);color:var(--ink-soft);cursor:pointer;font-weight:500;transition:none}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.controls label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer;font-weight:500}
.controls label input{width:14px;height:14px;accent-color:var(--blue)}
.controls .count{margin-left:auto;font-size:11px;color:var(--ink-faint);font-weight:500}

/* Multi-select dropdown */
.dropdown{position:relative}
.dd-btn{font-family:inherit;font-size:12px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dd-caret{font-size:9px;color:var(--ink-faint)}
.dd-menu{display:none;position:absolute;top:34px;left:0;z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(20,27,36,.12);padding:6px;min-width:220px;max-height:320px;overflow-y:auto}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--canvas)}
.dd-item input{width:14px;height:14px;accent-color:var(--blue);flex-shrink:0}
.dd-clear{font-size:10.5px;color:var(--blue);cursor:pointer;padding:5px 8px;font-weight:600;border-top:1px solid var(--line-soft);margin-top:4px}
.export-btn{font-family:inherit;font-size:12px;height:30px;padding:0 14px;border:1px solid var(--green);border-radius:6px;background:var(--green);color:#fff;cursor:pointer;font-weight:600;white-space:nowrap}
.export-btn:hover{background:#0f6640}

/* Table */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{
  text-align:left;font-weight:600;color:var(--ink-faint);
  font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;
  padding:11px 12px;border-bottom:1px solid var(--line);
  background:var(--canvas);white-space:nowrap;position:sticky;top:0;z-index:2;
}
thead th.num{text-align:right}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--ink)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody td.num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
tbody tr.se-row{cursor:pointer}
tbody tr.se-row:hover td{background:var(--canvas)}
tbody tr.se-row.open td{background:var(--blue-soft);border-bottom-color:transparent}

.se-name{font-weight:600;color:var(--ink);font-size:13px}
.se-tags{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:0.02em}
.tag-ksa{background:var(--red-soft);color:var(--red)}
.tag-team{background:var(--amber-soft);color:var(--amber)}
.tag-new{background:var(--blue-soft);color:var(--blue)}
.team-cell{font-size:11.5px;color:var(--ink-soft)}
.val-award{color:var(--green);font-weight:600}
.val-inv{color:var(--amber);font-weight:600}

/* Score */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:26px;border-radius:6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.score-hi{background:var(--green-soft);color:var(--green)}
.score-mid{background:var(--amber-soft);color:var(--amber)}
.score-lo{background:var(--red-soft);color:var(--red)}

/* Sparkline */
.spark{display:flex;gap:1.5px;align-items:flex-end;height:26px}
.spark i{width:5px;border-radius:1px 1px 0 0;flex-shrink:0;display:block}

.chev{color:var(--ink-faint);font-size:10px;transition:none}
tr.open .chev{color:var(--blue)}

/* Expanded */
tr.detail>td{padding:0;background:var(--blue-soft)}
.detail-inner{padding:14px 16px 18px;overflow-x:auto}
.mtable{border-collapse:collapse;min-width:100%;font-size:11px}
.mtable td{padding:5px 7px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.mtable .rowlab{text-align:left;font-weight:600;padding-right:12px;position:sticky;left:0;background:var(--blue-soft)}
.mtable .mhead td{color:var(--ink-faint);font-size:9.5px;font-weight:600;border-bottom:1px solid var(--line)}
.mtable .mhead .rowlab{background:var(--blue-soft)}
.cell-q{background:#e8f0fc;color:#1a4fb0;border-radius:3px;font-weight:600}
.cell-a{background:#e2f1e9;color:#0f6640;border-radius:3px;font-weight:600}
.cell-i{background:#f9eed6;color:#8f5a0d;border-radius:3px;font-weight:600}
.cell-0{color:#c2cad3}
.mtable .tgtlab{font-weight:600;font-style:italic;color:var(--ink-soft)}
.mtable .tgt-hi{color:#0f6640;font-weight:700}
.mtable .tgt-mid{color:#8f5a0d;font-weight:700}
.mtable .tgt-lo{color:#c0392b;font-weight:700}
.tag-runrate{background:#e7f3ff;color:#1f5fd6}
.tag-project{background:#eafaf0;color:#0f6640}
.tag-mix{background:#fff4e5;color:#8f5a0d}
.tag-unclassified{background:#eef0f2;color:#8b96a3}
.pf-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11.5px}
.pf-table .pf-head td{font-size:10px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line)}
.pf-table td{padding:6px 8px;border-bottom:1px solid var(--canvas)}
.pf-table td.num{text-align:center;font-variant-numeric:tabular-nums;width:44px}
.pf-name{font-weight:600;color:var(--ink)}
.pf-dx{font-size:10.5px;color:var(--ink-soft);white-space:nowrap;width:118px}
.dxmv{display:flex;height:12px;width:118px;border-radius:3px;overflow:hidden;background:#eef0f2}
.dxmv .dx{background:#1f5fd6}
.dxmv .mv{background:#b06f10}

/* Analytics */
.analytics-head{font-size:15px;font-weight:650;letter-spacing:-0.01em;margin:26px 0 4px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.analytics-head span{font-size:11px;font-weight:500;color:var(--ink-faint);letter-spacing:0}
.rank-grid{display:grid;gap:14px;margin-top:14px}
.rank-grid.g3{grid-template-columns:repeat(3,1fr)}
.rank-grid.g2{grid-template-columns:repeat(2,1fr)}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.rcard h3{font-size:12.5px;font-weight:650;color:var(--ink);margin-bottom:2px}
.rcard .desc{font-size:10.5px;color:var(--ink-faint);margin-bottom:12px;line-height:1.5}
.rrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rrow .rk{font-size:10px;color:var(--ink-faint);width:16px;text-align:right;flex-shrink:0;font-weight:600}
.rrow .nm{font-size:11px;color:var(--ink-soft);width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rrow .bar{flex:1;height:16px;background:var(--canvas);border-radius:4px;overflow:hidden;position:relative}
.rrow .bar i{display:block;height:100%;border-radius:4px}
.rrow .vv{font-size:10.5px;font-weight:600;min-width:44px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

@media(max-width:1100px){.rank-grid.g3{grid-template-columns:1fr}.rank-grid.g2{grid-template-columns:1fr}}

/* Page nav tabs */
.page-nav{display:flex;gap:0;margin:18px 0 0;border-bottom:2px solid var(--line)}
.page-nav button{font-family:inherit;font-size:13px;font-weight:600;padding:10px 22px;border:none;background:none;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:none}
.page-nav button.active{color:var(--blue);border-bottom-color:var(--blue)}
.page-nav button:hover{color:var(--ink)}
.view{display:none}.view.active{display:block}

/* Chart containers */
.chart-row{display:grid;gap:18px;margin-top:18px}
.chart-row.c2{grid-template-columns:1fr 1fr}
.chart-row.c1{grid-template-columns:1fr}
@media(max-width:900px){.chart-row.c2{grid-template-columns:1fr}}
.chart-box{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.chart-box h3{font-size:13px;font-weight:650;color:var(--ink);margin-bottom:2px}
.chart-box .chart-desc{font-size:10.5px;color:var(--ink-faint);margin-bottom:14px}
.chart-box canvas{width:100%!important;max-height:320px}
.se-picker{margin:18px 0 6px;display:flex;align-items:center;gap:10px}
.se-picker select{font-family:inherit;font-size:12px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:240px}
.se-picker label{font-size:12px;color:var(--ink-soft);font-weight:600}

/* Trend controls bar */
.trend-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 6px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.trend-controls label{font-size:12px;color:var(--ink-soft);font-weight:600}
.trend-controls select{font-family:inherit;font-size:12px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;font-weight:500;min-width:180px}
.cmp-vs{font-size:12px;font-weight:700;color:var(--ink-faint)}
.score-info{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;font-style:normal;text-decoration:none;cursor:pointer;vertical-align:middle;margin-left:4px;opacity:0.7;transition:opacity 0.15s}.score-info:hover{opacity:1}
.score-breakdown td{background:var(--bg);border-bottom:1px solid var(--line)}
.chart-row.c3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.team-card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;flex:1;min-width:200px}
.team-card h4{font-size:13px;font-weight:600;margin:0 0 6px}
.team-card .tc-metric{font-size:11px;color:var(--ink-soft);margin:2px 0}
.team-card .tc-metric b{color:var(--ink);font-weight:600}
.team-card .tc-tags{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.tc-spark{display:inline-flex;align-items:end;gap:1px;height:16px;margin-left:6px;vertical-align:middle}
.tc-spark i{width:2px;border-radius:1px}
.fs-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:none;align-items:center;justify-content:center}
.fs-overlay.open{display:flex}
.fs-box{background:var(--paper);border-radius:12px;width:94vw;height:88vh;padding:20px 24px;position:relative;display:flex;flex-direction:column}
.fs-close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:inherit;z-index:1}
.fs-close:hover{color:var(--ink)}
.fs-title{font-size:14px;font-weight:600;margin:0 0 8px}
.fs-canvas-wrap{flex:1;position:relative;min-height:0}
.expand-btn{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;font-family:inherit;padding:2px 6px;margin-left:6px;opacity:0.7}
.expand-btn:hover{opacity:1;text-decoration:underline}
.se-exclude{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:transparent;color:var(--ink-faint);font-size:13px;font-weight:400;text-decoration:none;cursor:pointer;vertical-align:middle;margin-left:2px;opacity:0;transition:opacity 0.15s;border:1px solid transparent}
.se-row:hover .se-exclude{opacity:0.5}.se-exclude:hover{opacity:1!important;color:var(--red);border-color:var(--red)}
.excluded-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;margin:0 0 6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--ink-soft)}
.excluded-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:11px;color:var(--ink);cursor:default}
.excluded-pill .x-restore{cursor:pointer;color:var(--blue);font-weight:700;margin-left:2px;font-size:13px}
.excluded-pill .x-restore:hover{color:var(--red)}
#seg-compare button{min-width:76px}
.cmp-header{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.cmp-header .cmp-badge{font-size:10px;font-weight:700;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.cmp-badge-a{background:var(--blue)}
.cmp-badge-b{background:var(--violet)}
/* Target vs Actual (KSA vs Team / Team vs Individual) */
.tva-wrap{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:12px 0 18px}
.tva-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;justify-content:space-between}
.tva-head h2{font-size:15px;font-weight:700;color:var(--ink);margin:0}
.tva-head h2 span{font-size:11px;font-weight:500;color:var(--ink-faint);margin-left:8px}
.tva-head select{font-family:inherit;font-size:12px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.tva-seg{margin:10px 0 4px;flex-wrap:wrap}
.tva-scroll{overflow-x:auto;margin-top:10px}
table.tva-grid{width:100%;border-collapse:collapse;font-size:11.5px;min-width:760px}
.tva-grid th{font-size:10.5px;font-weight:650;color:var(--ink-soft);text-align:center;padding:6px 6px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
.tva-grid th.on{color:var(--blue);border-bottom-color:var(--blue)}
.tva-grid th:first-child{text-align:left;cursor:default}
.tva-grid td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tva-grid td:first-child{text-align:left;font-weight:600;color:var(--ink)}
.tva-grid tr.tva-tot td{background:var(--blue-soft);font-weight:700}
.tva-grid tr.tva-sel td:first-child{color:var(--blue)}
.tva-grid tr.tva-click{cursor:pointer}
.tva-grid tr.tva-click:hover td{background:#f6f8fa}
.tva-grid td.on{box-shadow:inset 0 0 0 1px rgba(31,95,214,.25)}
.tva-pct{font-size:13px;font-weight:700;display:block}
.tva-sub{font-size:9.5px;color:var(--ink-faint);display:block}
.tva-hi{color:#0f6640}.tva-mid{color:#8f5a0d}.tva-lo{color:#c0392b}.tva-na{color:var(--ink-faint)}
.tva-note{font-size:10.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5}
.tva-note b{color:var(--ink-soft)}
.tva-note details summary{cursor:pointer;color:var(--blue);font-weight:600}
.tva-method{margin-top:8px;color:var(--ink-soft);font-size:11px;line-height:1.55}
.tva-method p{margin:8px 0}
.tva-method h4{font-size:12px;color:var(--ink);margin:12px 0 4px}
.tva-method ol{margin:0 0 0 18px}
table.tva-mt{width:100%;border-collapse:collapse;margin:6px 0;font-size:10.5px}
.tva-mt th{text-align:left;background:var(--blue-soft);color:var(--ink);padding:5px 6px;border-bottom:1px solid var(--line)}
.tva-mt td{vertical-align:top;padding:5px 6px;border-bottom:1px solid var(--line)}
.tva-tgts{margin-top:12px;padding:10px 12px;background:var(--blue-soft);border-radius:6px;font-size:11px;color:var(--ink-soft);line-height:1.7}
.tva-tgts b{color:var(--ink)}
.tva-tgts span{display:inline-block;min-width:110px;font-weight:650;color:var(--ink)}
.tva-pick{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.tva-pick label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.tva-pick select{font-family:inherit;font-size:12px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:220px}
.tva-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:10px}
@media(max-width:900px){.tva-kpis{grid-template-columns:repeat(2,1fr)}}
.tva-kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper)}
.tva-kl{font-size:10.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em}
.tva-kv{font-size:20px;font-weight:700;color:var(--ink);margin:2px 0}
.tva-ks{font-size:10px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="company">Shaker Group · Sales Operations</div>
      <h1>Sales Engineer Performance Review</h1>
    </div>
    <div class="meta">
      <div>Period: <b>Jan 2025 — <span id="cur-month"></span></b></div>
      <div>Prepared for <b>EVP review</b></div>
      <div id="gen-date"></div>
    </div>
  </div>

  <div class="page-nav" id="page-nav">
    <button class="active" data-view="trends">Trends &amp; Analytics</button>
    <button data-view="table">SE Rankings</button>
    <button data-view="teams">Team Summary</button>
  </div>

  <!-- ===== VIEW: TRENDS ===== -->
  <div class="view active" id="view-trends">
    <div id="tva-ksa"></div>
  </div>

  <!-- ===== VIEW: TABLE ===== -->
  <div class="view" id="view-table">

  <div class="method" id="method-box"></div>
  <div id="score-explainer" style="display:none">
    <div class="method" style="margin-top:0;border-top:0;border-radius:0 0 8px 8px" id="explainer-detail"></div>
  </div>

  <div class="controls">
    <div class="seg" id="seg-channel">
      <button data-ch="project" class="on">Projects</button>
      <button data-ch="acs">ACS</button>
      <button data-ch="all">All</button>
    </div>
    <div class="dropdown" id="dd-team">
      <button class="dd-btn" type="button">All teams <span class="dd-caret">&#9662;</span></button>
      <div class="dd-menu" id="dd-team-menu"></div>
    </div>
    <div class="dropdown" id="dd-se">
      <button class="dd-btn" type="button">All engineers <span class="dd-caret">&#9662;</span></button>
      <div class="dd-menu" id="dd-se-menu"></div>

// Capped normalization: floor at 2nd lowest, cap at 2nd highest.
// Extremes on both ends get clipped — mid-pack spreads cleanly.
function wnorm(a,v){
  if(a.length<3){var mn=Math.min.apply(null,a),mx=Math.max.apply(null,a);return mx>mn?(v-mn)/(mx-mn)*100:50;}
  var s=a.slice().sort(function(x,y){return x-y;});
  var lo=s[1], hi=s[s.length-2]; // 2nd lowest, 2nd highest
  if(hi<=lo)return 50;
  var cv=Math.max(lo,Math.min(hi,v));
  return(cv-lo)/(hi-lo)*100;
}

function seScoreBreakdown(se, allPeers){
  var sp=scoreParts(se, allPeers);
  var f=sp.formula, pc=sp.peerCount||1;
  // Compute actual rank position per component (1 = best)
  var cp=allPeers;
  function rankPos(normArr,myVal){
    var above=normArr.filter(function(v){return v>myVal;}).length;
    return above+1;
  }

  // Build component list — universal formula 15/15/20/30/20
  var comps=[
    {label:'Quotation value',basis:'per-month avg',raw:sar(sp.quoPM)+' SAR/mo',norm:sp.quoN,w:0.15,pts:Math.round(0.15*sp.quoN)},
    {label:'Q → HP conversion',basis:'latest month',raw:sp.hasHP?(sp.qhpRaw*100).toFixed(1)+'%':'No HP data',norm:sp.qhpN,w:0.15,pts:Math.round(0.15*sp.qhpN)},
    {label:'Award value',basis:'per-month avg',raw:sar(sp.awdPM)+' SAR/mo',norm:sp.awdN,w:0.20,pts:Math.round(0.20*sp.awdN)},
    {label:'HP → Award conversion',basis:'cumulative',raw:sp.hasHPA?(sp.hpaRaw*100).toFixed(1)+'%':'No HP data',norm:sp.hpaN,w:0.30,pts:Math.round(0.30*sp.hpaN)},
    {label:'Invoiced value',basis:'per-month avg',raw:sar(sp.invPM)+' SAR/mo',norm:sp.invN,w:0.20,pts:Math.round(0.20*sp.invN)}
  ];
  var normArrays=[
    cp.map(function(s){return scoreParts(s,allPeers).quoN;}),cp.map(function(s){return scoreParts(s,allPeers).qhpN;}),
    cp.map(function(s){return scoreParts(s,allPeers).awdN;}),cp.map(function(s){return scoreParts(s,allPeers).hpaN;}),
    cp.map(function(s){return scoreParts(s,allPeers).invN;})
  ];
  comps.forEach(function(c,i){c.rankPos=rankPos(normArrays[i],c.norm);});

  var totalPts=comps.reduce(function(s,c){return s+c.pts;},0);
  var sorted=comps.slice().sort(function(a,b){return a.norm-b.norm;});

    left+='<div style="margin:0 0 8px;padding:7px 10px;background:var(--bg);border-radius:6px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between">'

      +'<div style="font-size:11px;color:var(--ink-soft);margin:2px 0">'+c.raw+' <span style="color:var(--ink-faint)">· '+c.basis+'</span> · <b style="color:var(--ink)">'+c.rankPos+' of '+pc+'</b> peers</div>'
      +'<div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden">'
      +'<div style="width:'+barW+'%;height:100%;border-radius:3px;background:var(--blue)"></div></div></div>'
      +'</div>';
  });
  left+='<div style="padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:13px;margin-top:6px">'
    +'<b>Total = '+comps.map(function(c){return c.pts;}).join(' + ')+' = '+totalPts+'</b></div>';

  // RIGHT: insights
  var right='<div style="font-size:13px;font-weight:700;margin:0 0 10px">Insights and analysis</div>';
  right+='<div style="padding:7px 10px;background:var(--bg);border-radius:6px;margin:0 0 6px;border-left:3px solid #137a4b">'
    +'<div style="font-size:11px;font-weight:600;color:#137a4b;margin:0 0 2px">Strongest: '+strongest.label+'</div>'

    +'</div>';
  var weakColor=weakest.norm<30?'#b91c1c':'#b06f10';
  right+='<div style="padding:7px 10px;background:var(--bg);border-radius:6px;margin:0 0 6px;border-left:3px solid '+weakColor+'">'

    +'<div>'+left+'</div><div>'+right+'</div></div>';
  return html;
}

    var qhN=nrm2(qhAll,qhpAtM),haN=nrm2(haAll,hpaSd>0?hpaSe/hpaSd:0);
    var ttl=Math.round(0.15*qn)+Math.round(0.15*qhN)+Math.round(0.20*an)+Math.round(0.30*haN)+Math.round(0.20*in_);
    seLine.push(ttl);
    quoLine.push(Math.round(qn)); qhpLine.push(Math.round(qhN)); awdLine.push(Math.round(an)); hpaLine.push(Math.round(haN)); invLine.push(Math.round(in_));
    var ksaSum=0,tmSum=0,tmN=0;allPeers.forEach(function(s2){
      var q2=nrm2(cpQ,pmS2(s2,'quo')),a2=nrm2(cpA,pmS2(s2,'awd')),i2=nrm2(cpI,pmS2(s2,'inv'));
      var qh2=nrm2(qhAll,(s2.hp_quo_pct||{})[pt.key]||0);
      var hp2n=0,hp2d=0;slice.forEach(function(m2){hp2n+=(s2.award_from_hp||{})[m2]||0;hp2d+=(s2.total_award_hp||{})[m2]||0;});
      var ha2=nrm2(haAll,hp2d>0?hp2n/hp2d:0);
      var sc2=Math.round(0.15*q2)+Math.round(0.15*qh2)+Math.round(0.20*a2)+Math.round(0.30*ha2)+Math.round(0.20*i2);
      ksaSum+=sc2; if(s2.team===se.team){tmSum+=sc2;tmN++;}
    });
    ksaLine.push(Math.round(ksaSum/allPeers.length)); teamLine.push(tmN?Math.round(tmSum/tmN):null);
  }
  // SE vs team avg vs KSA avg only (parameter lines removed, Abdul 28-Oct-2026)
  var lastOf=function(arr){var l=-1;arr.forEach(function(v,k){if(v!=null)l=k;});return l;};
  var datasets=[
    {label:se.se_name,data:seLine,borderColor:'#141b24',pointRadius:2.5,pointBackgroundColor:'#141b24',borderWidth:2.5,tension:0.3,
     datalabels:{display:function(c){return seLine[c.dataIndex]!=null;},font:{size:9,weight:'bold'},color:'#141b24',anchor:'end',align:'top',offset:1}},

     datalabels:{display:function(c){return c.dataIndex===lastOf(teamLine);},font:{size:9,weight:'bold'},color:'#1f5fd6',anchor:'end',align:'right',offset:4,formatter:function(v){return 'Team '+v;}}},
    {label:'KSA avg',data:ksaLine,borderColor:'#8b96a3',pointRadius:0,pointHitRadius:8,borderWidth:1.8,borderDash:[2,3],tension:0.3,
     datalabels:{display:function(c){return c.dataIndex===lastOf(ksaLine);},font:{size:9,weight:'bold'},color:'#6b7682',anchor:'end',align:'right',offset:4,formatter:function(v){return 'KSA '+v;}}}
  ];
  _charts[canvasId]=new Chart(ctx.getContext('2d'),{type:'line',data:{labels:labels,datasets:datasets},
    options:{responsive:true,maintainAspectRatio:true,aspectRatio:2.5,interaction:{mode:'index',intersect:false},layout:{padding:{right:56}},plugins:{legend:{position:'bottom',labels:{font:{size:9},boxWidth:12}},datalabels:{clip:false,formatter:function(v){return v!=null?v:'';}}},
    scales:{x:{ticks:{font:{size:8},maxRotation:65},grid:yoyGrid},y:{min:0,max:100,ticks:{font:{size:8},callback:function(v){return v}}}}}});
}

function sar(v){
  if(!v&&v!==0)return'--';
  var n=Math.abs(v);
  if(n>=1e6)return(v<0?'-':'')+(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(v<0?'-':'')+Math.round(n/1e3)+'K';
  return Math.round(v).toLocaleString();
}

var _cutoffMonth=null;
function cutoffMonth(){
  if(_cutoffMonth)return _cutoffMonth;
  var latest='2025-01';
  SE_DATA.forEach(function(s){
    if(s.monthly_sales)Object.keys(s.monthly_sales).forEach(function(yr){
      var mo=s.monthly_sales[yr];
      if(mo&&typeof mo==='object')Object.keys(mo).forEach(function(m){
        if((mo[m]||0)>0){
          var key=yr+'-'+(parseInt(m)<10?'0':'')+m;
          if(key>latest)latest=key;
        }
      });
    });
  });
  _cutoffMonth=latest;
  return latest;
}

function months(){
  var out=[], start=new Date(2025,0,1);
  var cut=cutoffMonth();
  var cutY=parseInt(cut.slice(0,4)), cutM=parseInt(cut.slice(5));
  var end=new Date(cutY,cutM-1,1);
  for(var d=new Date(start); d<=end; d.setMonth(d.getMonth()+1))
    out.push(d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1));
  if(STATE.year==='2025')return out.filter(function(m){return m.indexOf('2025')===0;});
  if(STATE.year==='2026')return out.filter(function(m){return m.indexOf('2026')===0;});
  return out;
}

function seData(se){
  var own=STATE.own, jdm=se.join_date?se.join_date.slice(0,7):null; // 'YYYY-MM' for month comparison
  var quo={}, award={}, inv={};
  if(se.monthly_quo)Object.keys(se.monthly_quo).forEach(function(k){
    if(own&&jdm&&k<jdm)return;  // exclude months BEFORE join month; join month included
    quo[k]=se.monthly_quo[k]||0;
  });
  if(se.monthly_award)Object.keys(se.monthly_award).forEach(function(k){
    if(own&&jdm&&k<jdm)return;
    award[k]=se.monthly_award[k]||0;
  });
  if(se.monthly_sales)Object.keys(se.monthly_sales).forEach(function(yr){
    var mo=se.monthly_sales[yr];
    if(mo&&typeof mo==='object')Object.keys(mo).forEach(function(m){
      var key=yr+'-'+(parseInt(m)<10?'0':'')+m;
      if(own&&jdm&&key<jdm)return;
      inv[key]=mo[m]||0;
    });
  });
  return {quo:quo,award:award,inv:inv};
}

function total(se,metric){
  var ms=months(), d=seData(se), map=metric==='quo'?d.quo:metric==='awd'?d.award:d.inv;
  return ms.reduce(function(s,m){return s+(map[m]||0);},0);
}

function activeMonths(se,headstart){
  var ms=months(), jd=se.join_date?new Date(se.join_date):new Date(2025,0,1);
  var active=ms.filter(function(m){return new Date(m+'-01')>=jd;}).length;
  // Only apply headstart if the ramp period (join + headstart months) overlaps
  // with the current filtered window. If the SE already ramped up before the
  // window starts, headstart = 0.
  var hs=headstart||0;
  if(hs>0 && ms.length>0){
    var rampEnd=new Date(jd.getFullYear(), jd.getMonth()+hs, 1);
    var windowStart=new Date(ms[0]+'-01');
    if(rampEnd<=windowStart) hs=0; // fully ramped before this window
  }
  return Math.max(1, active-hs);
}

// Channel type: determines which scoring formula to apply.
// 'project' teams get the 5-component formula (with HP hit rates).
// All others ('acs') get the 3-component value formula.
var PROJECT_TEAMS = {'East Projects':1,'West Projects':1,'Central Projects':1,'Direct Channel':1};
// ACS teams use 30/40/30 value formula: ACS - ER, ACS - WR, ACS - CR
function isProjectTeam(team){return PROJECT_TEAMS[team]||false;}

// Channel-aware peer pool for normalization: project SEs normalize against
// project peers, ACS against ACS peers. This keeps the two scales independent.
function channelPeers(allPeers, se){
  return allPeers;
}

// Stable normalization pool — ignores channel/team/SE/tenure/type filters.
// Only excludes inactive + manually excluded SEs. Scores never change with filters.
function normPool(){
  return SE_DATA.filter(function(s){
    if(STATE.excluded.indexOf(s.se_name)>=0)return false;
    if(!STATE.showInactive && INACTIVE_SES[s.se_name])return false;
    return true;
  });
}

function scoreParts(se,allPeers){
  var HS={quo:2, awd:2, inv:2};
  // Normalize value metrics within the SE's own channel pool
  var cp=channelPeers(allPeers,se);
  function perMo(s,metric){var t=activeMonths(s,HS[metric]);return t>0?total(s,metric)/t:0;}
  var invA=cp.map(function(s){return perMo(s,'inv');});
  var awdA=cp.map(function(s){return perMo(s,'awd');});
  var quoA=cp.map(function(s){return perMo(s,'quo');});
  function norm(a,v){return wnorm(a,v);}
  var qi=perMo(se,'quo'), ai=perMo(se,'awd'), ii=perMo(se,'inv');
  var qN=norm(quoA,qi), aN=norm(awdA,ai), iN=norm(invA,ii);

  // Universal formula: 15% Quo, 15% Q→HP, 20% Award, 30% HP→Award, 20% Invoiced
  var ms_=months();
  function latestPct(s){var obj=s.hp_quo_pct||{};for(var i=ms_.length-1;i>=0;i--){if(obj[ms_[i]]!=null)return obj[ms_[i]];}return 0;}
  function sumField(s,field){var obj=s[field]||{},v=0;ms_.forEach(function(m){v+=obj[m]||0;});return v;}
  function hpaRatio(s){var n=sumField(s,'award_from_hp'),d=sumField(s,'total_award_hp');return d>0?n/d:0;}
  var qhpR=latestPct(se), hpaR=hpaRatio(se);
  var qhpAll=cp.map(function(s){return latestPct(s);});
  var hpaAll=cp.map(function(s){return hpaRatio(s);});
  var qhpN=norm(qhpAll,qhpR), hpaN=norm(hpaAll,hpaR);
  var hasHP=Object.keys(se.hp_quo_pct||{}).length>0;
  var hasHPA=sumField(se,'award_from_hp')>0;
  var score=Math.round(0.15*qN)+Math.round(0.15*qhpN)+Math.round(0.20*aN)+Math.round(0.30*hpaN)+Math.round(0.20*iN);
  return {quoPM:qi, awdPM:ai, invPM:ii, quoN:qN, awdN:aN, invN:iN,
          qhpRaw:qhpR, hpaRaw:hpaR, hasHP:hasHP, hasHPA:hasHPA,
          qhpN:qhpN, hpaN:hpaN, peerCount:cp.length, score:score};
}
function composite(se,peers){ return scoreParts(se,peers).score; }

function peers(){
  return SE_DATA.filter(function(s){
    if(STATE.excluded.indexOf(s.se_name)>=0)return false;
    if(!STATE.showInactive && INACTIVE_SES[s.se_name])return false;
    if(STATE.channel==='project' && !isProjectTeam(s.team))return false;
    if(STATE.channel==='acs' && isProjectTeam(s.team))return false;
    if(STATE.tenure==='new' && !s.join_date)return false;
    if(STATE.tenure==='old' && s.join_date)return false;
    if(STATE.type!=='all' && (s.se_type||'Unclassified')!==STATE.type)return false;
    if(STATE.teams.length && STATE.teams.indexOf(s.team)===-1)return false;
    if(STATE.ses.length && STATE.ses.indexOf(s.se_name)===-1)return false;
    return true;
  });
}

function toggleRow(tr){
  var idx=tr.getAttribute('data-idx');
  var det=document.querySelector('[data-detail="'+idx+'"]');
  if(!det)return;
  var open=det.style.display!=='none';
  if(open){det.style.display='none';tr.classList.remove('open');return;}
  det.style.display='table-row';
  tr.classList.add('open');
  var inner=det.querySelector('.detail-inner');
  var name=tr.getAttribute('data-name');
  var se=SE_DATA.find(function(s){return s.se_name===name;});
  if(!se){inner.innerHTML='';return;}
  var ms=months(), d=seData(se);
  function row(label,cls,map){
    return'<tr><td class="rowlab" style="color:inherit">'+label+'</td>'
      +ms.map(function(m){var v=map[m]||0;return'<td class="'+(v>0?cls:'cell-0')+'">'+(v>0?sar(v):'–')+'</td>';}).join('')+'</tr>';
  }
  function hasTgt(o){return o&&Object.keys(o).some(function(y){return o[y]>0;});}
  function tgtRow(label,tgtByYear,map){
    if(!hasTgt(tgtByYear))return'';
    return'<tr><td class="rowlab tgtlab">'+label+'</td>'
      +ms.map(function(m){
        var mm=parseInt(m.slice(5),10);
        if(mm%3!==0)return'<td class="cell-0"></td>';
        var yr=m.slice(0,4), tgt=tgtByYear&&tgtByYear[yr];
        if(!tgt||tgt<=0)return'<td class="cell-0">–</td>';
        var cum=0;
        for(var k=1;k<=mm;k++){var key=yr+'-'+(k<10?'0':'')+k;cum+=map[key]||0;}
        var pct=Math.round(cum/tgt*100);
        var cls=pct>=100?'tgt-hi':pct>=75?'tgt-mid':'tgt-lo';
        return'<td class="'+cls+'">'+pct+'%</td>';
      }).join('')+'</tr>';
  }
  inner.innerHTML='<table class="mtable">'
    +'<tr class="mhead"><td class="rowlab">Month</td>'+ms.map(function(m){return'<td>'+m.slice(5)+'/'+m.slice(2,4)+'</td>';}).join('')+'</tr>'
    +row('Quotations','cell-q',d.quo)
    +row('Award','cell-a',d.award)
    +row('Invoiced','cell-i',d.inv)
    +tgtRow('Award vs target',se.award_tgt,d.award)
    +tgtRow('Invoiced vs target',se.inv_tgt,d.inv)
    +'</table>';
}

function renderAnalytics(){
  var p=peers();
  var ms=months();
  function card(title,desc,entries,fmt,color){
    if(!entries.length)return'';
    var mx=entries[0][1]||1;
    var rows=entries.slice(0,12).map(function(e,i){
      var w=Math.round(e[1]/mx*100);
      return'<div class="rrow"><div class="rk">'+(i+1)+'</div>'
        +'<div class="nm">'+esc(e[0])+'</div>'
        +'<div class="bar"><i style="width:'+w+'%;background:'+color+'"></i></div>'
        +'<div class="vv">'+fmt(e[1])+'</div></div>';
    }).join('');
    return'<div class="rcard"><h3>'+title+'</h3><div class="desc">'+desc+'</div>'+rows+'</div>';
  }

  // Quotation
  // All value-based cards route through seData() so the "Own quotations only"
  // toggle (and pre-join drop) applies here exactly as it does in the table.
  var quoAvg=p.map(function(se){var d=seData(se);var t=ms.reduce(function(s,m){return s+(d.quo[m]||0);},0);return [se.se_name,Math.round(t/activeMonths(se,2))];}).sort(function(a,b){return b[1]-a[1];});
  var newAcc=p.map(function(se){var v=STATE.year==='2026'?se.new_accs_2026||0:STATE.year==='2025'?se.new_accs_2025||0:(se.new_accs_2025||0)+(se.new_accs_2026||0);return [se.se_name,v];}).sort(function(a,b){return b[1]-a[1];}).filter(function(e){return e[1]>0;});
  var obR=p.map(function(se){return [se.se_name,se.ob_reactivations||0];}).sort(function(a,b){return b[1]-a[1];}).filter(function(e){return e[1]>0;});

  // Award
  var awdAvg=p.map(function(se){var d=seData(se);var t=ms.reduce(function(s,m){return s+(d.award[m]||0);},0);return [se.se_name,Math.round(t/activeMonths(se,2))];}).sort(function(a,b){return b[1]-a[1];});
  // Ratio cards (hit, a2d) stay period-independent: summed over all months,
  // not restricted to the selected year, since quoting/award/invoicing lag
  // across year boundaries. They do honour the own-quotations filter via d.*.
  var hit=p.map(function(se){var d=seData(se);var q=Object.values(d.quo).reduce(function(a,b){return a+b;},0);var a=Object.values(d.award).reduce(function(x,y){return x+y;},0);return [se.se_name,q>0?Math.round(a/q*100):0];}).sort(function(a,b){return b[1]-a[1];}).filter(function(e){return e[1]>0;});

  // Sales
  var invAvg=p.map(function(se){var d=seData(se);var t=ms.reduce(function(s,m){return s+(d.inv[m]||0);},0);return [se.se_name,Math.round(t/activeMonths(se,2))];}).sort(function(a,b){return b[1]-a[1];});
  var a2d=p.map(function(se){var d=seData(se);var a=Object.values(d.award).reduce(function(x,y){return x+y;},0);var iv=Object.values(d.inv).reduce(function(x,y){return x+y;},0);return [se.se_name,a>0?Math.round(iv/a*100):0];}).sort(function(a,b){return b[1]-a[1];}).filter(function(e){return e[1]>0;});

  var pct=function(v){return v+'%';};

  // SE profile: awarded-project size mix (per unique quotation) + DX/MV product split
  var pf=p.map(function(se){
    var sp=se.size_projects||{Small:0,Medium:0,Large:0,Mega:0,Giga:0};

function populateCompareDropdowns(pool){
  var names=pool.map(function(s){return s.se_name;}).sort();
  ['se-pick-a','se-pick-b','se-pick-cmp'].forEach(function(id){
    var sel=document.getElementById(id);
    var cur=sel.value; sel.innerHTML='';
    names.forEach(function(n){
      var o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);
    });
    if(cur && names.indexOf(cur)>=0)sel.value=cur;
    else if(names.length)sel.value=names[0];
  });
  // For SE vs SE, default B to second name
  var selB=document.getElementById('se-pick-b');
  if(!selB.value && names.length>1)selB.value=names[1];

  populateTeamDropdown(pool);

function populateTeamDropdown(pool){
  var teams=[...new Set(pool.map(function(s){return s.team;}).filter(Boolean))].sort();
  var sel=document.getElementById('team-pick-b');
  var cur=sel.value; sel.innerHTML='';
  teams.forEach(function(t){
    var o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);
  });
  if(cur && teams.indexOf(cur)>=0) sel.value=cur;
  else {
    // Default to selected SE's team
    var seA=document.getElementById('se-pick-cmp').value;
    var rec=pool.find(function(s){return s.se_name===seA;});
    if(rec && teams.indexOf(rec.team)>=0) sel.value=rec.team;
    else if(teams.length) sel.value=teams[0];
  }
}

// Build a synthetic SE record that aggregates a team's data
function buildTeamAggregate(teamName, pool, ms){
  var members=pool.filter(function(s){return s.team===teamName;});
  if(!members.length) return null;
  var agg={se_name:teamName+' (team)', team:teamName, _isTeam:true,
    monthly_quo:{}, monthly_award:{}, monthly_sales:{},
    new_accs_2025:0, new_accs_2026:0, ob_reactivations:0, dx_mv:{}};
  // Sum pipeline across members (monthly_quo and monthly_award are flat {key:val})
  // monthly_sales is nested {year:{month:val}} — build both formats
  ms.forEach(function(m){
    var q=0,a=0,iv=0;
    members.forEach(function(se){
      var d=seData(se); q+=d.quo[m]||0; a+=d.award[m]||0; iv+=d.inv[m]||0;
    });
    agg.monthly_quo[m]=q; agg.monthly_award[m]=a;
    // monthly_sales in nested format
    var yr=m.slice(0,4), mo=String(parseInt(m.slice(5)));
    if(!agg.monthly_sales[yr]) agg.monthly_sales[yr]={};
    agg.monthly_sales[yr][mo]=iv;
  });
  // Sum accounts
  members.forEach(function(se){
    agg.new_accs_2025+=(se.new_accs_2025||0);
    agg.new_accs_2026+=(se.new_accs_2026||0);
    agg.ob_reactivations+=(se.ob_reactivations||0);
  });
  // Sum DX/MV
  members.forEach(function(se){
    if(!se.dx_mv) return;
    Object.keys(se.dx_mv).forEach(function(yr){
      if(!agg.dx_mv[yr]) agg.dx_mv[yr]={DX:0,MV:0};
      agg.dx_mv[yr].DX+=(se.dx_mv[yr].DX||0);
      agg.dx_mv[yr].MV+=(se.dx_mv[yr].MV||0);
    });
  });
  // Sum targets (for team-level target %)
  var at={}, it={};
  members.forEach(function(se){
    if(se.award_tgt) Object.keys(se.award_tgt).forEach(function(yr){ at[yr]=(at[yr]||0)+se.award_tgt[yr]; });
    if(se.inv_tgt) Object.keys(se.inv_tgt).forEach(function(yr){ it[yr]=(it[yr]||0)+se.inv_tgt[yr]; });
  });
  if(Object.keys(at).length) agg.award_tgt=at;
  if(Object.keys(it).length) agg.inv_tgt=it;
  return agg;
}

// Renders score/target/pipeline/accounts/mix for one SE
function renderSEChartsFor(se,p,ms,idScore,idTgt,idPipe,idAcc,idMix){
  if(!se)return;

  // COMPOSITE SCORE — 3 lines: SE, KSA avg, team avg
  (function(){
    var ctx=getCtx(idScore);if(!ctx)return;
    var yoy=yoyMonths(ms), HS={quo:2,awd:2,inv:2};
    var teamPeers=p.filter(function(s){return s.team===se.team;});
    var labels=[],seLine=[],ksaLine=[],teamLine=[];
    for(var i=0;i<yoy.length;i++){
      var pt=yoy[i]; labels.push(pt.label);
      var slice=ms.filter(function(m){return m<=pt.key;});
      if(!slice.length){seLine.push(null);ksaLine.push(null);teamLine.push(null);continue;}
      function totalS(s,metric){var d=seData(s),v=0,k=metric==='awd'?'award':metric==='inv'?'inv':'quo';slice.forEach(function(m){v+=d[k][m]||0;});return v;}
      function amS(s,hs){var jd=s.join_date;if(!jd)return Math.max(1,slice.length-hs);var y=parseInt(jd.slice(0,4)),m=parseInt(jd.slice(5,7)),last=slice[slice.length-1],ly=parseInt(last.slice(0,4)),lm=parseInt(last.slice(5)),active=(ly-y)*12+(lm-m)+1;return Math.max(1,(active<1?0:active)-hs);}
      function pmS(s,metric){var t=amS(s,HS[metric]);return t>0?totalS(s,metric)/t:0;}
      function nrm(a,v){return wnorm(a,v);}
      // Q→HP: use this specific month's ratio (pt.key)
      function qhpAtMonth(s){return(s.hp_quo_pct||{})[pt.key]||0;}
      // HP→Award: cumulative up to this time slice
      function sumSlice(s,field){var obj=s[field]||{},v=0;slice.forEach(function(m){v+=obj[m]||0;});return v;}
      function hpaSlice(s){var n=sumSlice(s,'award_from_hp'),d=sumSlice(s,'total_award_hp');return d>0?n/d:0;}
      // Universal formula normalization
      var cpAll=p;
      function composeScore(s){
        var cpQ=cpAll.map(function(x){return pmS(x,'quo');}),cpA=cpAll.map(function(x){return pmS(x,'awd');}),cpI=cpAll.map(function(x){return pmS(x,'inv');});
        var qn=nrm(cpQ,pmS(s,'quo')),an=nrm(cpA,pmS(s,'awd')),in_=nrm(cpI,pmS(s,'inv'));
        var qhAll=cpAll.map(function(x){return qhpAtMonth(x);});
        var haAll=cpAll.map(function(x){return hpaSlice(x);});
        var qhN=nrm(qhAll,qhpAtMonth(s)),haN=nrm(haAll,hpaSlice(s));
        return Math.round(0.15*qn)+Math.round(0.15*qhN)+Math.round(0.20*an)+Math.round(0.30*haN)+Math.round(0.20*in_);
      }
      seLine.push(composeScore(se));
      // KSA avg
      var ksaSum=0;p.forEach(function(s){ksaSum+=composeScore(s);});
      ksaLine.push(Math.round(ksaSum/p.length));
      // Team avg
      var tSum=0;teamPeers.forEach(function(s){tSum+=composeScore(s);});
      teamLine.push(teamPeers.length?Math.round(tSum/teamPeers.length):null);
    }
    _charts[idScore]=new Chart(ctx,{type:'line',data:{labels:labels,datasets:[
      {label:se.se_name,data:seLine,borderColor:'#141b24',backgroundColor:'transparent',pointRadius:3,pointBackgroundColor:'#141b24',borderWidth:2.5,tension:0.3,
       datalabels:{display:function(c){return c.dataIndex===seLine.length-1&&seLine[c.dataIndex]!=null;},font:{size:10,weight:'bold'},color:'#141b24',anchor:'end',align:'top'}},
      {label:'KSA avg',data:ksaLine,borderColor:'rgba(31,95,214,0.55)',backgroundColor:'transparent',pointRadius:0,borderWidth:1.8,borderDash:[6,3],tension:0.3,
       datalabels:{display:function(c){return c.dataIndex===ksaLine.length-1&&ksaLine[c.dataIndex]!=null;},font:{size:9},color:'rgba(31,95,214,0.8)',anchor:'end',align:'bottom'}},
      {label:'Team avg',data:teamLine,borderColor:'rgba(15,102,64,0.55)',backgroundColor:'transparent',pointRadius:0,borderWidth:1.8,borderDash:[3,3],tension:0.3,
       datalabels:{display:function(c){return c.dataIndex===teamLine.length-1&&teamLine[c.dataIndex]!=null;},font:{size:9},color:'rgba(15,102,64,0.8)',anchor:'end',align:'bottom'}}
    ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:10}}},datalabels:{formatter:function(v){return v!=null?v:'';}}},
      scales:{x:{ticks:{font:{size:9},maxRotation:65},grid:yoyGrid},y:{min:0,max:100,ticks:{callback:function(v){return v}}}}}});
  })();

  // TARGET ACHIEVEMENT — tighter bars, yoy gridlines
  (function(){
    var ctx=getCtx(idTgt);if(!ctx)return;
    var d=seData(se),at=se.award_tgt||{},it=se.inv_tgt||{};
    if(!Object.keys(at).length&&!Object.keys(it).length){
      _charts[idTgt]=new Chart(ctx,{type:'bar',data:{labels:['No targets'],datasets:[]},options:{responsive:true}});return;
    }
    var cut=cutoffMonth(),cutYr=parseInt(cut.slice(0,4)),cutMo=parseInt(cut.slice(5));
    var yrs=Object.keys(Object.assign({},at,it)).sort();
    var labels=[],awdPct=[],invPct=[];
    [3,6,9,12].forEach(function(endMo){
      yrs.forEach(function(yr){
        var yri=parseInt(yr);
        if(yri>cutYr||(yri===cutYr&&endMo-2>cutMo))return;
        var cum_a=0,cum_i=0;
        for(var k=1;k<=endMo;k++){var key=yr+'-'+(k<10?'0':'')+k;cum_a+=d.award[key]||0;cum_i+=d.inv[key]||0;}
        var ap=at[yr]?Math.round(cum_a/at[yr]*100):0;
        var ip=it[yr]?Math.round(cum_i/it[yr]*100):0;
        labels.push('Q'+(endMo/3)+' '+yr.slice(2));awdPct.push(ap);invPct.push(ip);
      });
    });
    _charts[idTgt]=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[
      Object.assign({label:'Award tgt %',data:awdPct,backgroundColor:awdPct.map(function(_,i){return labels[i].indexOf('25')>=0?C.awd25:C.awd26;}),
       datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},font:{size:9,weight:'bold'},color:'#333',anchor:'end',align:'top'}},BAR_TIGHT),
      Object.assign({label:'Inv tgt %',data:invPct,backgroundColor:invPct.map(function(_,i){return labels[i].indexOf('25')>=0?C.inv25:C.inv26;}),
       datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},font:{size:9,weight:'bold'},color:'#333',anchor:'end',align:'top'}},BAR_TIGHT)
    ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:11}}},datalabels:{formatter:fmtPct}},scales:{x:{ticks:{font:{size:10}},grid:yoyGrid},y:{ticks:{callback:function(v){return v+'%'}}}}}});
  })();

  // PIPELINE — tighter bars, capped height, yoy gridlines
  (function(){
    var ctx=getCtx(idPipe);if(!ctx)return;
    var d=seData(se),yoy=yoyMonths(ms);
    var labels=[],q25=[],q26=[],a25=[],a26=[],i25=[],i26=[];
    yoy.forEach(function(pt){
      labels.push(pt.label);
      var q=(d.quo[pt.key]||0)/1e6,a=(d.award[pt.key]||0)/1e6,iv=(d.inv[pt.key]||0)/1e6;
      if(pt.yr==='2025'){q25.push(q);a25.push(a);i25.push(iv);q26.push(0);a26.push(0);i26.push(0);}
      else{q26.push(q);a26.push(a);i26.push(iv);q25.push(0);a25.push(0);i25.push(0);}
    });
    var dlL=Object.assign({},dlLight,{anchor:'end',align:'top'});
    var dlW=Object.assign({},dlWhite,{anchor:'end',align:'top'});
    _charts[idPipe]=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[
      Object.assign({label:'Quo 25',data:q25,backgroundColor:C.quo25,stack:'s',datalabels:dlL},BAR_TIGHT),
      Object.assign({label:'Awd 25',data:a25,backgroundColor:C.awd25,stack:'s',datalabels:dlL},BAR_TIGHT),
      Object.assign({label:'Inv 25',data:i25,backgroundColor:C.inv25,stack:'s',datalabels:dlL},BAR_TIGHT),
      Object.assign({label:'Quo 26',data:q26,backgroundColor:C.quo26,stack:'s',datalabels:dlW},BAR_TIGHT),
      Object.assign({label:'Awd 26',data:a26,backgroundColor:C.awd26,stack:'s',datalabels:dlW},BAR_TIGHT),
      Object.assign({label:'Inv 26',data:i26,backgroundColor:C.inv26,stack:'s',datalabels:dlW},BAR_TIGHT)
    ]},options:{responsive:true,maintainAspectRatio:true,aspectRatio:2.8,plugins:{legend:{position:'top',labels:{font:{size:10},filter:function(item){return ['Quo 25','Awd 25','Inv 25'].indexOf(item.text)>=0;}}},datalabels:{formatter:fmtM}},scales:{x:{stacked:true,ticks:{font:{size:9},maxRotation:65},grid:yoyGrid},y:{stacked:true,ticks:{callback:function(v){return v+'M'}}}}}});
  })();

  // ACCOUNTS — stacked [New Accs + OB], YoY paired x-axis [2025 | 2026]
  (function(){
    var ctx=getCtx(idAcc);if(!ctx)return;
    var labels=['2025','2026'];

    var pairGrid={color:function(c){return c.index===1?'rgba(0,0,0,0.32)':'rgba(0,0,0,0.05)';},lineWidth:function(c){return c.index===1?1.5:0.5;}};
    _charts[idAcc]=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[
      Object.assign({label:'New accounts',data:na,backgroundColor:[C.acc25,C.acc26],stack:'s',
       datalabels:{display:function(c){return c.dataset.data[c.dataIndex]>0;},font:{size:11,weight:'bold'},
        color:function(c){return c.dataIndex===0?'#333':'#fff';},anchor:'center'}},BAR_TIGHT),

       datalabels:{display:function(c){return c.dataset.data[c.dataIndex]>0;},font:{size:11,weight:'bold'},color:'#333',anchor:'center'}},BAR_TIGHT)
    ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:11}}},datalabels:{formatter:fmtN}},

function renderTrendsTable(){
  if(!document.getElementById('tbody-trend'))return;  // table removed from Trends page
  var p=trendPool(), np=normPool();
  var rows=p.map(function(se){
    return {se:se, score:composite(se,np), quo:total(se,'quo'), awd:total(se,'awd'), inv:total(se,'inv')};
  });
  var avg=rows.reduce(function(s,r){return s+r.score;},0)/(rows.length||1);
  var teamScores={};
  rows.forEach(function(r){ (teamScores[r.se.team]=teamScores[r.se.team]||[]).push(r.score); });
  var teamAvg={};
  Object.keys(teamScores).forEach(function(t){ teamAvg[t]=teamScores[t].reduce(function(a,b){return a+b;},0)/teamScores[t].length; });

  var sk=STATE.trendSort;
  rows.sort(function(a,b){ return sk==='score'?b.score-a.score:b[sk]-a[sk]; });

  var mColor={quo:'#1f5fd6',awd:'#137a4b',inv:'#b06f10'};
  var ms_=months();
  var met=STATE.trendMetric;
  var html='';
  rows.forEach(function(r,idx){
    var se=r.se, d=seData(se);
    var sparkData=ms_.map(function(m){return met==='quo'?d.quo[m]||0:met==='awd'?d.award[m]||0:d.inv[m]||0;});
    var mx=Math.max.apply(null,sparkData)||1;
    var spark=sparkData.map(function(v){
      var h=v>0?Math.max(2,Math.round(v/mx*26)):2;
      return'<i style="height:'+h+'px;background:'+(v>0?mColor[met]:'#e4e8ec')+'"></i>';
    }).join('');
    var belowKSA=r.score<avg, belowTeam=r.score<(teamAvg[se.team]||50);

    if(se.se_type && se.se_type!=='Unclassified')tags+='<span class="tag tag-'+se.se_type.toLowerCase().replace('-','')+'">'+se.se_type+'</span>';

      +'<td class="num val-inv">'+sar(r.inv)+'</td>'
      +'<td><div class="spark">'+spark+'</div></td>'
      +'<td class="num"><span class="score '+sc+'">'+r.score+'</span></td>'
      +'<td><span class="chev">&#9660;</span></td>'
      +'</tr>'
      +'<tr class="detail" data-tdetail="'+idx+'" style="display:none"><td colspan="8"><div class="detail-inner" data-name="'+escAttr(se.se_name)+'"></div></td></tr>';
  });
  document.getElementById('tbody-trend').innerHTML=html;
  document.getElementById('trend-row-count').textContent=rows.length+' engineers · ranked by '+(sk==='score'?'composite score':sk);

  document.querySelectorAll('[data-tidx]').forEach(function(tr){

      var ms2=months(), d2=seData(se);
      function row2(label,cls,map){
        return'<tr><td class="rowlab" style="color:inherit">'+label+'</td>'
          +ms2.map(function(m){var v=map[m]||0;return'<td class="'+(v>0?cls:'cell-0')+'">'+(v>0?sar(v):'–')+'</td>';}).join('')+'</tr>';
      }
      function hasTgt2(o){return o&&Object.keys(o).some(function(y){return o[y]>0;});}
      function tgtRow2(label,tgtByYear,map){
        if(!hasTgt2(tgtByYear))return'';
        return'<tr><td class="rowlab tgtlab">'+label+'</td>'
          +ms2.map(function(m){

            var cum=0;
            for(var k=1;k<=mm;k++){var key=yr+'-'+(k<10?'0':'')+k;cum+=map[key]||0;}
            var pct=Math.round(cum/tgt*100);
            var cls=pct>=100?'tgt-hi':pct>=75?'tgt-mid':'tgt-lo';
            return'<td class="'+cls+'">'+pct+'%</td>';
          }).join('')+'</tr>';
      }
      inner.innerHTML='<table class="mtable">'
        +'<tr class="mhead"><td class="rowlab">Month</td>'+ms2.map(function(m){return'<td>'+m.slice(5)+'/'+m.slice(2,4)+'</td>';}).join('')+'</tr>'

        +row2('Award','cell-a',d2.award)
        +row2('Invoiced','cell-i',d2.inv)
        +tgtRow2('Award vs target',se.award_tgt,d2.award)
        +tgtRow2('Invoiced vs target',se.inv_tgt,d2.inv)
        +'</table>';
    });
  });
}

function renderTeamSummary(){

  Chart.defaults.set('plugins.datalabels',{display:false});

  renderTVATeam();
  return;  // other Team Summary charts removed (Abdul, 28-Oct-2026)
  var ch=_teamSummaryState.ch;
  var allActive=SE_DATA.filter(function(s){
    if(STATE.excluded.indexOf(s.se_name)>=0)return false;
    if(MGR_TEAMS && MGR_TEAMS.indexOf(s.team)<0)return false;  // managers: own team(s) only
    if(!STATE.showInactive && INACTIVE_SES[s.se_name])return false;
    if(ch==='project'&&!isProjectTeam(s.team))return false;
    if(ch==='acs'&&isProjectTeam(s.team))return false;
    return true;
  });
  var ms=months(),yoy=yoyMonths(ms);

  var teamMap={};

  });

  // Compute scores for each SE (always against full norm pool)
  var np=normPool();
  teamNames.forEach(function(t){
    teamMap[t].members.forEach(function(se){
      teamMap[t].scores.push({se:se,score:composite(se,np)});
    });
    teamMap[t].scores.sort(function(a,b){return b.score-a.score;});
  });

  // CHART 1: Team avg score trend (one line per team)
  (function(){
    var ctx=getCtx('ch-team-score');if(!ctx)return;
    var HS={quo:2,awd:2,inv:2};
    var datasets=[];
    teamNames.forEach(function(tn,ti){

        var pt=yoy[i];

        if(!slice.length){line.push(null);continue;}
        // Compute avg score at this time point for this team
        var members=teamMap[tn].members;
        function totalS3(s,metric){var d=seData(s),v=0,k=metric==='awd'?'award':metric==='inv'?'inv':'quo';slice.forEach(function(m){v+=d[k][m]||0;});return v;}
        function amS3(s,hs){var jd=s.join_date;if(!jd)return Math.max(1,slice.length-hs);var y=parseInt(jd.slice(0,4)),m=parseInt(jd.slice(5,7)),last=slice[slice.length-1],ly=parseInt(last.slice(0,4)),lm=parseInt(last.slice(5)),active=(ly-y)*12+(lm-m)+1;return Math.max(1,(active<1?0:active)-hs);}
        function pmS3(s,metric){var t2=amS3(s,HS[metric]);return t2>0?totalS3(s,metric)/t2:0;}
        function nrm3(a,v){return wnorm(a,v);}
        var cpAll=allActive;
        function sc3(s){
          var cpQ=cpAll.map(function(x){return pmS3(x,'quo');}),cpA=cpAll.map(function(x){return pmS3(x,'awd');}),cpI=cpAll.map(function(x){return pmS3(x,'inv');});
          var qn=nrm3(cpQ,pmS3(s,'quo')),an=nrm3(cpA,pmS3(s,'awd')),in_=nrm3(cpI,pmS3(s,'inv'));

      options:{responsive:true,plugins:{legend:{position:'top',labels:{font:{size:10}}},datalabels:{formatter:fmtM}},
      scales:{x:{ticks:{font:{size:9},maxRotation:65},grid:yoyGrid},y:{ticks:{callback:function(v){return v+'M'}}}}}});
  });

  // Team cards
  var cardsHtml='<div style="display:flex;gap:12px;flex-wrap:wrap;padding:4px 0">';
  teamNames.forEach(function(tn){
    var tm=teamMap[tn], members=tm.members, scores=tm.scores;
    var avgScore=scores.length?Math.round(scores.reduce(function(s,r){return s+r.score;},0)/scores.length):0;
    var totalQuo=0,totalAwd=0,totalInv=0;

    var top=scores[0],bot=scores[scores.length-1];
    var sc=avgScore>=60?'score-hi':avgScore>=40?'score-mid':'score-lo';
    cardsHtml+='<div class="team-card">'
      +'<h4>'+esc(tn)+'</h4>'

      +'<div class="tc-metric">Quo: <b>'+sar(totalQuo)+'</b> · Awd: <b>'+sar(totalAwd)+'</b> · Inv: <b>'+sar(totalInv)+'</b></div>'
      +'<div class="tc-tags">'

      +(bot&&bot!==top?'<span class="tag tag-ksa" style="font-size:10px">Lowest: '+bot.se.se_name+' ('+bot.score+')</span>':'')
      +'</div></div>';

  cardsHtml+='</div>';
  document.getElementById('team-cards-row').innerHTML=cardsHtml;

  // Team rankings table
  var tbody='';

    var tm=teamMap[tn], scores=tm.scores;
    var avgScore=scores.length?Math.round(scores.reduce(function(s,r){return s+r.score;},0)/scores.length):0;

    var top=scores[0],bot=scores[scores.length-1];

      +'<td class="num">'+sar(totalQuo)+'</td>'

  });
  document.getElementById('tbody-teams').innerHTML=tbody;
}

// -- AUTH GATE --
// ===== TARGET vs ACTUAL — KSA vs Team (EVP/ops) and Team vs Individual (team-locked) =====
// Award + Invoice targets: target_files_for_se.xlsx (annual per SE). Hit ratio h = own current-year YTD
// Award / Quotation (quotations excl. all 15%), at each level (SE / team / KSA).
// Derived (*) targets:
//   Quotation*      = Award target / h  (Power BI "tgt pipeline"), pro-rated monthly
//   HOT conv %*     = 2 x h  (HOT should close at twice the hit ratio)
//   HOT*            = (Award target / 4) / HOT conv % target  -> HOT needed at month end to cover the next 3 months' award
//   HOT share %*    = HOT target / active quotations (30/50/70%) in the same snapshot
//   HOT awarded*    = HOT conv % target x HOT base (award we should have got from the HOT we had)
// HOT data: Historical Pipeline month-end snapshots (build_se_report.py -> hs_hot, hs_act, hs_hcb, hs_hca).
var TVA={metric:'awd', ksaTeam:null, team:null};
var MGR_TEAMS=null;   // set by startReport for manager roles
var TVA_M=[
  {k:'quo', lab:'Quotation',     kind:'flow',  der:true},
  {k:'hotp',lab:'Quo \u2192 HP %', kind:'rate',  der:true},
  {k:'awd', lab:'Award',         kind:'flow'},
  {k:'hawp',lab:'HP \u2192 Award %',kind:'rate',  der:true},
  {k:'inv', lab:'Invoice',       kind:'flow'},
  {k:'hit', lab:'Hit ratio',     kind:'info'}
];
// (HOT value 'hot' and HOT awarded value 'haw' are still calculated by tvaCalc for the worked example)
var TVA_EXTRA={hot:{k:'hot',lab:'HP',kind:'stock'},haw:{k:'haw',lab:'HP awarded',kind:'flow'}};
function tvaMeta(k){for(var i=0;i<TVA_M.length;i++)if(TVA_M[i].k===k)return TVA_M[i];return TVA_EXTRA[k];}
function tvaYear(){return cutoffMonth().slice(0,4);}
function tvaMonths(){var y=tvaYear(),cm=parseInt(cutoffMonth().slice(5)),o=[];for(var i=1;i<=cm;i++)o.push(y+'-'+(i<10?'0':'')+i);return o;}
function tvaPool(){return SE_DATA.filter(function(s){return STATE.excluded.indexOf(s.se_name)<0&&s.team;});}
function tvaSeries(list){
  var ms=tvaMonths(),K=['quo','awd','inv','hh','ha','hb','hw','afh','tah'],o={ms:ms};
  K.forEach(function(k){o[k]=ms.map(function(){return 0;});});
  list.forEach(function(s){
    var d=seData(s),qh=s.monthly_quo_hr,jdm=(STATE.own&&s.join_date)?s.join_date.slice(0,7):null;
    ms.forEach(function(m,i){
      // Quotation = hit-ratio base (Power BI rule: excludes all 15% DX & MV); falls back to monthly_quo
      o.quo[i]+=qh?((jdm&&m<jdm)?0:(qh[m]||0)):(d.quo[m]||0); o.awd[i]+=d.award[m]||0; o.inv[i]+=d.inv[m]||0;
      o.hh[i]+=(s.hs_hot||{})[m]||0; o.ha[i]+=(s.hs_act||{})[m]||0;
      o.hb[i]+=(s.hs_hcb||{})[m]||0; o.hw[i]+=(s.hs_hca||{})[m]||0;
      o.afh[i]+=(s.award_from_hp||{})[m]||0; o.tah[i]+=(s.total_award_hp||{})[m]||0;  // Power BI 'HP to Award %' CSV
    });
  });
  return o;
}
function tvaSum(a,to){var v=0;for(var i=0;i<=(to==null?a.length-1:to);i++)v+=a[i]||0;return v;}
var _tvaHi=null,_tvaCi=null;
function tvaHi(){ // last snapshot month (index) with HOT data
  if(_tvaHi!=null)return _tvaHi;
  var o=tvaSeries(tvaPool()),h=-1,c=-1;o.ha.forEach(function(v,i){if(v>0)h=i;});o.hb.forEach(function(v,i){if(v>0)c=i;});
  _tvaHi=h;_tvaCi=c;return h;
}
function tvaCi(){tvaHi();return _tvaCi;} // last snapshot month whose 3-month award window is complete
function tvaHit(o){var q=tvaSum(o.quo);return q>0?tvaSum(o.awd)/q:0;}
// Annual targets from award/invoice target + hit ratio at that level
// HP share of award target (Abdul, 28-Oct-2026): projects teams 75%, ACS teams 50% (rest from run-rate business)
function tvaShare(team){return isProjectTeam(team)?0.75:0.5;}
function tvaTargets(awd,inv,hit,sh){
  if(!awd&&!inv)return null;
  var cv=Math.min(1,2*hit);                     // HP close rate assumed at 2 x hit ratio
  return {awd:awd, inv:inv, quo:hit>0?awd/hit:0, hcv:cv, hsh:sh, hot:cv>0?sh*awd/4/cv:0};
}
function tvaYT(s,k){return ((s[k]||{})[tvaYear()])||0;}
// Build model: KSA, teams, SEs (each {name, o (series), t (targets)})
function tvaModel(){
  var pool=tvaPool(),ko=tvaSeries(pool),K=tvaHit(ko),byT={};
  pool.forEach(function(s){(byT[s.team]=byT[s.team]||[]).push(s);});
  var ka=0,ki=0,ksh=0;
  var teams=Object.keys(byT).sort().map(function(tn){
    var o=tvaSeries(byT[tn]),th=tvaHit(o)||K,ta=0,ti=0,sh=tvaShare(tn);
    var ses=byT[tn].map(function(s){
      var so=tvaSeries([s]),a=tvaYT(s,'award_tgt'),iv=tvaYT(s,'inv_tgt');ta+=a;ti+=iv;
      return {name:s.se_name,list:[s],o:so,t:tvaTargets(a,iv,tvaHit(so)||th,sh),inactive:!!INACTIVE_SES[s.se_name]};});
    ka+=ta;ki+=ti;ksh+=ta*sh;
    return {name:tn,list:byT[tn],o:o,t:tvaTargets(ta,ti,th,sh),ses:ses};
  });
  return {ksa:{name:'KSA',list:pool,o:ko,t:tvaTargets(ka,ki,K,ka>0?ksh/ka:0.5)},teams:teams};
}
// Actual vs target for one entity + metric: YTD and monthly series
function tvaCalc(e,k){
  var o=e.o,t=e.t,ms=o.ms,n=ms.length,h=tvaHi(),ci=tvaCi(),r={act:null,tgt:null,ma:[],mt:[]};
  if(k==='quo'||k==='awd'||k==='inv'){
    var arr=o[k],c=0;
    ms.forEach(function(_,i){c+=arr[i]||0;r.ma.push(c);r.mt.push(t&&t[k]?t[k]*(i+1)/12:null);});
    r.act=tvaSum(arr);r.tgt=t&&t[k]?t[k]*n/12:null;
  } else if(k==='hot'){
    ms.forEach(function(_,i){r.ma.push(i<=h?o.hh[i]:null);r.mt.push(t&&t.hot?t.hot:null);});
    r.act=h>=0?o.hh[h]:null; r.tgt=t&&t.hot?t.hot:null;
  } else if(k==='hotp'){
    ms.forEach(function(_,i){var a=o.ha[i];r.ma.push(i<=h&&a>0?o.hh[i]/a:null);r.mt.push(i<=h&&a>0&&t&&t.hot?Math.min(1,t.hot/a):null);});
    var a=h>=0?o.ha[h]:0;r.act=a>0?o.hh[h]/a:null;r.tgt=a>0&&t&&t.hot?Math.min(1,t.hot/a):null;
  } else if(k==='haw'){ // per month-end HOT: awarded within 3 months; YTD = average per month-end
    ms.forEach(function(_,i){if(i<=ci){r.ma.push(o.hw[i]);r.mt.push(t&&t.hcv?t.hcv*o.hb[i]:null);}else{r.ma.push(null);r.mt.push(null);}});
    var nc=ci+1;r.act=ci>=0?tvaSum(o.hw,ci)/nc:null;r.tgt=(ci>=0&&t&&t.hcv)?t.hcv*tvaSum(o.hb,ci)/nc:null;
  } else { // hawp: HP share of award (Power BI: Award from HP / Total award), by month; YTD pooled
    var la=-1;o.tah.forEach(function(v,i){if(v>0)la=i;});
    ms.forEach(function(_,i){var d=o.tah[i];r.ma.push(d>0?o.afh[i]/d:(i<=la?0:null));r.mt.push(t&&t.hsh?t.hsh:null);});
    var d=tvaSum(o.tah);r.act=d>0?tvaSum(o.afh)/d:null;r.tgt=t&&t.hsh?t.hsh:null;
  }
  r.pct=(r.act!=null&&r.tgt)?r.act/r.tgt:null;
  return r;
}

  var lab=[],ap=[],ip=[],yr=[];
  [3,6,9,12].forEach(function(e){yrs.forEach(function(y){

      {label:e.name+' actual',data:r.ma.map(P),borderColor:'#1f5fd6',backgroundColor:'#1f5fd6',borderWidth:2.5,pointRadius:3,tension:0.25,spanGaps:true,
        datalabels:{display:function(x){return x.dataset.data[x.dataIndex]!=null;},align:'top',font:{size:9,weight:'bold'},color:'#1f5fd6',formatter:function(v){return v+'%';}}},
      {label:e.name+' target',data:r.mt.map(P),borderColor:'#c0392b',backgroundColor:'#c0392b',borderDash:[6,4],borderWidth:2,pointRadius:0,pointHoverRadius:4,pointHitRadius:10,spanGaps:true,datalabels:endLabel('#c0392b','%')}];
    if(ref){var rr=tvaCalc(ref,k);ds.push({label:refName+' actual',data:rr.ma.map(P),borderColor:'#141b24',borderWidth:1.5,pointRadius:2,tension:0.25,spanGaps:true});}
    _charts[id]=new Chart(c,{type:'line',data:{labels:lab,datasets:ds},options:lineOpt('%')});
  }
  rateChart(px+'-qhp','hotp');rateChart(px+'-hpa','hawp');
}
var TVA_COLORS=['#1f5fd6','#b06f10','#0f6640','#8e44ad','#c0392b','#16a085','#7f8c8d'];

// ---- KSA vs Team (Trends tab; EVP / operations only) ----
function renderTVAKsa(){
  var root=document.getElementById('tva-ksa');if(!root)return;
  if(MGR_TEAMS){root.style.display='none';return;}
  var M=tvaModel(),opts=[{v:'KSA',l:'KSA'}].concat(M.teams.map(function(t){return {v:t.name,l:t.name};}));
  if(!TVA.ksaTeam||!opts.some(function(o){return o.v===TVA.ksaTeam;}))TVA.ksaTeam='KSA';
  var e=TVA.ksaTeam==='KSA'?M.ksa:M.teams.filter(function(t){return t.name===TVA.ksaTeam;})[0];
  root.innerHTML='<div class="tva-wrap"><div class="tva-head"><h2>KSA vs Team — Target vs Actual<span>'+tvaYear()+' YTD</span></h2></div>'
    +tvaPanelHtml('tvk',opts,TVA.ksaTeam)+tvaNote(M,e)+'</div>';
  document.getElementById('tvk-pick').addEventListener('change',function(){TVA.ksaTeam=this.value;renderTVAKsa();});
  tvaDraw('tvk',e,e===M.ksa?null:M.ksa,'KSA');
}

// ---- Team vs Individual (Team Summary tab; managers see only their team) ----
function renderTVATeam(){
  var root=document.getElementById('tva-team');if(!root)return;
  var M=tvaModel();
  var teams=M.teams.filter(function(t){return !MGR_TEAMS||MGR_TEAMS.indexOf(t.name)>=0;});
  if(!teams.length){root.innerHTML='';return;}
  if(!TVA.team||!teams.some(function(t){return t.name===TVA.team;}))TVA.team=teams[0].name;
  var T=teams.filter(function(t){return t.name===TVA.team;})[0];
  var ses=T.ses.filter(function(s){return STATE.showInactive||!s.inactive||tvaSum(s.o.awd)>0;}).sort(function(a,b){return a.name<b.name?-1:1;});
  var opts=[{v:'__team',l:T.name+' (team)'}].concat(ses.map(function(s){return {v:s.name,l:s.name+(s.t?'':' (no target)')};}));
  if(!TVA.teamSel||!opts.some(function(o){return o.v===TVA.teamSel;}))TVA.teamSel='__team';
  var e=TVA.teamSel==='__team'?T:ses.filter(function(s){return s.name===TVA.teamSel;})[0];
  var pick=teams.length>1?'<select id="tva-team-pick">'+teams.map(function(t){return '<option'+(t.name===TVA.team?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+'</select>':'';
  root.innerHTML='<div class="tva-wrap"><div class="tva-head"><h2>'+esc(T.name)+' — Team vs Individual, Target vs Actual<span>'+tvaYear()+' YTD</span></h2>'+pick+'</div>'
    +tvaPanelHtml('tvt',opts,TVA.teamSel)+tvaNote(M,e)+'</div>';
  var p=document.getElementById('tva-team-pick');if(p)p.addEventListener('change',function(){TVA.team=this.value;TVA.teamSel='__team';renderTVATeam();});
  document.getElementById('tvt-pick').addEventListener('change',function(){TVA.teamSel=this.value;renderTVATeam();});
  tvaDraw('tvt',e,e===T?null:T,T.name+' (team)');
}

function startReport(session){
  var role=session.role;
  // SE role: no access to this report
  if(role==='se'){
    document.body.innerHTML='<div style="max-width:420px;margin:80px auto;text-align:center;font-family:Inter,sans-serif">'
      +'<div style="font-size:40px;margin-bottom:12px">&#128683;</div>'
      +'<div style="font-size:16px;font-weight:600;color:#141b24;margin-bottom:6px">Access restricted</div>'
      +'<div style="font-size:12px;color:#8b96a3">This report is available to managers and leadership only.</div></div>';
    return;
  }
  // Managers: lock to their own team(s). getTeams() returns array (or null for full access).
  var teams=(typeof ShakerAuth.getTeams==='function')?ShakerAuth.getTeams():null;
  if(!teams && role && role.indexOf('manager_')===0){
    var t=ShakerAuth.getTeam(); if(t)teams=[t];
  }
  if(teams && teams.length && role && role.indexOf('manager_')===0){
    STATE.teams=teams.slice();
    MGR_TEAMS=teams.slice();
    // Trends tab is EVP/ops only -> hide it and open Team Summary
    var tb=document.querySelector('#page-nav button[data-view="trends"]');if(tb)tb.style.display='none';
    document.querySelectorAll('#page-nav button').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-view')==='teams');});
    document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('active',v.id==='view-teams');});
    // hide the team dropdown so they can't widen scope
    var ddTeam=document.getElementById('dd-team');
    if(ddTeam)ddTeam.style.display='none';
  }
  var _wrap=document.querySelector('.wrap'); if(_wrap)_wrap.style.visibility='visible';
  updateMethodBox();
  buildTeamMenu();
  updateTeamBtn();
  renderAll();
}

if(typeof ShakerAuth!=='undefined'){
  var _wrap=document.querySelector('.wrap'); if(_wrap)_wrap.style.visibility='hidden';
  ShakerAuth.init({
    onLogin: function(session){ startReport(session); },
    onFail: function(){ /* login UI shown by ShakerAuth */ }
  });
} else {
  // Auth unavailable (e.g. opened as local file) — render without gate
  updateMethodBox();
  renderAll();
}
</script>
